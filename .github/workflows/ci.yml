name: Continuous Integration

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            common/package-lock.json
            daemon/package-lock.json
            panel/package-lock.json
            frontend/package-lock.json

      - name: Install all dependencies
        run: |
          chmod +x ./install-dependents.sh
          ./install-dependents.sh

      - name: Run ESLint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: Run TypeCheck (frontend)
        working-directory: frontend
        run: npm run type-check

      - name: Run TypeCheck (panel)
        working-directory: panel
        run: npx tsc --noEmit

      - name: Run TypeCheck (daemon)
        working-directory: daemon
        run: npx tsc --noEmit

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install all dependencies
        run: |
          chmod +x ./install-dependents.sh
          ./install-dependents.sh

      - name: Build all projects
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Verify production output
        run: |
          test -f production-code/daemon/app.js
          test -f production-code/web/app.js
          test -d production-code/web/public
          echo "Build verification passed"
