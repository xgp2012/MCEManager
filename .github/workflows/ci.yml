name: Continuous Integration

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, panel, daemon]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Run ESLint (frontend)
        if: matrix.project == 'frontend'
        working-directory: ${{ matrix.project }}
        run: npm run lint

      - name: Run TypeCheck
        working-directory: ${{ matrix.project }}
        run: |
          if [ -f package.json ] && grep -q '"type-check"' package.json; then
            npm run type-check
          elif [ "${{ matrix.project }}" = "panel" ] || [ "${{ matrix.project }}" = "daemon" ]; then
            npx tsc --noEmit
          fi

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install all dependencies
        run: |
          chmod +x ./install-dependents.sh
          ./install-dependents.sh

      - name: Build all projects
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Verify production output
        run: |
          test -f production-code/daemon/app.js
          test -f production-code/web/app.js
          test -d production-code/web/public
          echo "Build verification passed"
